$kind: http-request
description: "Expected: 302 redirect back to /login"
url: "{{baseUrl}}/login"
method: POST
body:
  type: urlencoded
  content:
    email: "{{adminEmail}}"
    password: wrong-password-123
scripts:
  - type: afterResponse
    code: |-
      pm.test("Wrong password is rejected: redirected back to /login", function () {
          pm.response.to.have.status(302);
          pm.expect(pm.response.headers.get("Location")).to.eql("/login");
      });
    language: text/javascript
settings:
  followRedirects: false
order: 2000
